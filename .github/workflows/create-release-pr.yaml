# Opens a release PR. It does not publish anything; release.yaml does that
# when the PR is merged.
name: Create Release PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      # npm version works without installing dependencies
      - name: Version bump
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          npm version "$VERSION_TYPE" --no-git-tag-version
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
      - name: Move Unreleased changes under the new version in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sed -i "0,/^## Unreleased$/s//## Unreleased\n\n## ${VERSION}/" CHANGELOG.md
      - name: Get release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          args=(-f "tag_name=v$VERSION" -f "target_commitish=$DEFAULT_BRANCH")
          if LAST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null); then
            echo "Previous release: $LAST_TAG"
            args+=(-f "previous_tag_name=$LAST_TAG")
          else
            echo "No previous release - this is the first release"
          fi
          RELEASE_NOTES=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq '.body')
          {
            echo "RELEASE_NOTES<<__RELEASE_NOTES_EOF__"
            echo "$RELEASE_NOTES"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_ENV"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: release/v${{ steps.version.outputs.version }}
          delete-branch: true
          title: "Release v${{ steps.version.outputs.version }}"
          # The PR body becomes the GitHub Release notes. Edit it before merging.
          body: |
            ${{ env.RELEASE_NOTES }}
          commit-message: "chore: release v${{ steps.version.outputs.version }}"
          labels: |
            Type: Release
          assignees: ${{ github.actor }}
          draft: true
